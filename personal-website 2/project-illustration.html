<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Illustration · Junice Lin</title>
    <meta name="description" content="Project illustration gallery by Yihong Junice Lin." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="project-illustration.css" />
  </head>
  <body>
    <header class="gallery-header">
      <a href="index.html#portfolio">JUNICE LIN</a>
      <nav aria-label="Gallery navigation">
        <a href="#board">Board</a>
        <a href="index.html#portfolio">Back to portfolio</a>
      </nav>
    </header>

    <main>
      <section class="gallery-hero">
        <p>Project Illustration</p>
        <h1>Emotional performance system illustrations.</h1>
      </section>

      <section id="board" class="gallery-section gallery-overview" aria-label="Project illustration overview">
        <figure class="gallery-board">
          <img loading="lazy" fetchpriority="low" decoding="async" src="assets/portfolio/project-illustration/whole-1.webp" alt="Complete Project Illustration board from PDF" />
          <figcaption>Complete Project Illustration board rendered from the original PDF.</figcaption>
        </figure>
        <figure>
          <img loading="lazy" fetchpriority="low" decoding="async" src="assets/portfolio/inner-theater.webp" alt="InnerTheater interface illustration" />
          <figcaption>InnerTheater</figcaption>
        </figure>
        <figure>
          <img loading="lazy" fetchpriority="low" decoding="async" src="assets/portfolio/guided-emotional-inquiry.webp" alt="Guided Emotional Inquiry interface illustration" />
          <figcaption>Guided Emotional Inquiry</figcaption>
        </figure>
        <figure>
          <img loading="lazy" fetchpriority="low" decoding="async" src="assets/portfolio/music-module.webp" alt="Music Module interface illustration" />
          <figcaption>Music Module</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
